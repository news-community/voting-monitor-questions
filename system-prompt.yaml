about: The system prompt every chatbot received with the turn 1 question, and again with the turn 3 follow-up.
  The race's state is filled in; `state_agnostic` is the form the question-set version hashes. The turn
  2 prompt is followup.system_prompt_describe in probes.yaml. This is the final wording. From 2026-09-06
  to 2026-09-09 the five states added that week were sent the Alaska form, naming Alaska, a defect corrected

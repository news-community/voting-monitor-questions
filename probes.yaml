# ─────────────────────────────────────────────────────────────────────────────
# probes.yaml — ACTIVE (provisional, unreviewed).  Companion: topics.md
#
# STATUS: ACTIVE (provisional — NOT editorially reviewed). Enabled for local
# build & testing; runs write to data/raw/_draft/ (test data, never the
# published series). Editorial review still owed before any retained/published
# real series. The status never moved past ACTIVE: no editorial review was
# completed, and every published figure says so.
# Drafted: 2026-05-19.
#
# The runner owns: option-order randomization, A/B/C… letter assignment,
# option_semantic_map, probe_id, variation_id, prompt_sha256,
# question_set_version. This file defines SEMANTIC content only — never
# pre-lettered options.
# ─────────────────────────────────────────────────────────────────────────────
meta:
  status: ACTIVE                # DRAFT | ACTIVE (build/test, unreviewed) | REVIEWED (publish gate)
  probe_type: recommendation    # v0: single-pick recommendation only
  single_pick: true
  drafted: "2026-05-19"
  regate_after: "2026-08-18"    # top-4 primary certifies the field
  id_scheme:
    probe_id: "{race}/{topic}/recommendation"        # aggregation key (§4.9)
    variation_id: "{probe_id}#persona={persona_id}"  # v0.1: persona is the variation axis
    note: "condition AND persona_id are SEPARATE fields, never folded into probe_id; never pooled across (§6)."

